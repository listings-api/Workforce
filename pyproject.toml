[project]
name = "workforce"
version = "0.1.0"
description = "WorkForce Agent: a Claude + Codex agent team CLI"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["prompt_toolkit>=3.0", "rich>=13", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
workforce = "workforce.cli:main"
wf = "workforce.team.launch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workforce*"]

[tool.setuptools.package-data]
workforce = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_pytest_probe: uses the real pytest-import probe in checks", "laya: needs a running Ollaya with a Laya model, set WF_LAYA_LIVE=1"]
